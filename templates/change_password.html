{% extends 'base.html' %}
{% block title %}Change Password · School Attendance{% endblock %}
{% block content %}
<div class="page-heading"><div><h1>Change password</h1><p>Replace the demo password before presenting the project.</p></div></div>
<section class="card narrow"><form method="post" class="form-grid single">
<label>Current password<input type="password" name="current_password" required></label>
<label>New password<input type="password" name="new_password" minlength="8" required></label>
<label>Confirm new password<input type="password" name="confirm_password" minlength="8" required></label>
<button class="btn btn-primary" type="submit">Save password</button>
</form></section>
{% endblock %}
